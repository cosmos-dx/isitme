[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-api"
version = "0.1.0"
description = "isitme Web API / BFF — Google OAuth, API keys, MCP config, and brain proxy for the local web app."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "isitme" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
    "httpx>=0.27",
    "authlib>=1.3",
    "google-auth[requests]>=2.30",
    "itsdangerous>=2.1",
    "python-dotenv>=1.0",
    "starlette>=0.36",
    "motor>=3.4",
]

[project.optional-dependencies]
openai = ["openai>=1.20"]
mongo = ["motor>=3.4"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mongomock-motor>=0.0.29",
]

[project.scripts]
web-api = "web_api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/web_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]
